blueprint:
  name: TRV room control (setpoint sync, smart mode, boost, valve arbitration)
  description: >-
    The per-room control logic for a Sonoff TRVZB driven by a Smart Thermostat
    (PID) climate entity, as one automation.


    **The PID does not write the valve helper.** The PID's heater is a separate
    "PID output" helper, and this automation is the only thing that writes the
    valve helper (which the valve-sync automation copies onto the TRV). Reason:
    with `pid_mode: off` the smart_thermostat keeps re-writing its frozen last
    output to its heater on every keep-alive tick, which would otherwise undo a
    boost or a parked position within a minute. The valve helper is set to:


    1. **0** if the PID climate entity is off (room heating policy: back door,
    far away, person away, switched off);

    2. else **100** if boost is on;

    3. else the **PID output** if smart mode is on;

    4. else the **parked position**.


    Other jobs:


    - **Setpoint sync** - the physical TRV and the PID controller mirror each
    other's target temperature (a "differ" check stops the two syncs
    ping-ponging).

    - **PID mode** - auto only while smart mode is on and boost is off,
    otherwise off.

    - **Boost** - stamps the start time; ends by itself after the configured
    time (checked every 5 minutes).

    - **Re-apply** - when smart mode or the parked position changes, when boost
    ends, on HA start, or when this automation is triggered manually (or via
    automation.trigger), it also turns the valve-sync automation on (skipped
    during boost). It no longer sets the PID climate entity to `heat`: whether a
    room is `off` or `heat` is decided by the room heating policy blueprint
    (trv-room-policy.yaml), and forcing `heat` here made every switched-off room
    flick on at each HA restart.


    The helpers, the PID climate entity and the valve-sync automation must exist
    already; they are inputs here. Mode is `queued` and every check is made when
    a run starts, so rapid toggles settle on the latest state.
  domain: automation
  author: Charles Baynham
  source_url: https://github.com/charlesbaynham/house-absolute-ha-setup/blob/master/blueprints/automation/charlesbaynham/trv-room-control.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    devices:
      name: Climate entities
      icon: mdi:thermostat
      input:
        trv_climate:
          name: Physical TRV
          description: The TRV's own climate entity (setpoint is mirrored with the PID controller).
          selector:
            entity:
              filter:
              - domain:
                - climate
        pid_climate:
          name: PID controller
          description: The smart_thermostat climate entity for this room.
          selector:
            entity:
              filter:
              - domain:
                - climate
    helpers:
      name: Helpers and automations
      icon: mdi:toggle-switch
      input:
        pid_output_helper:
          name: PID output helper
          description: >-
            The 0-100 input_number that is the PID controller's heater (it
            writes here, not to the valve helper).
          selector:
            entity:
              filter:
              - domain:
                - input_number
        valve_helper:
          name: Valve position helper
          description: >-
            The 0-100 input_number that the valve-sync automation copies onto
            the TRV. Written only by this automation.
          selector:
            entity:
              filter:
              - domain:
                - input_number
        parked_valve_helper:
          name: Parked valve position helper
          description: The 0-100 input_number holding the valve position used when smart mode is off.
          selector:
            entity:
              filter:
              - domain:
                - input_number
        smart_mode:
          name: Smart mode switch
          selector:
            entity:
              filter:
              - domain:
                - input_boolean
        boost_mode:
          name: Boost mode switch
          selector:
            entity:
              filter:
              - domain:
                - input_boolean
        boost_start:
          name: Boost start time helper
          description: input_datetime (date and time) recording when boost began.
          selector:
            entity:
              filter:
              - domain:
                - input_datetime
        valve_sync_automation:
          name: Valve sync automation
          description: >-
            The arnie580/sonoff-trv-pid automation for this room. It is switched
            on whenever smart mode is re-applied.
          selector:
            entity:
              filter:
              - domain:
                - automation
    settings:
      name: Settings
      icon: mdi:cog
      collapsed: true
      input:
        boost_duration:
          name: Boost duration
          description: Boost is switched off once it has been running this long.
          default: 60
          selector:
            number:
              min: 5
              max: 480
              step: 5
              unit_of_measurement: min
mode: queued
max: 10
variables:
  trv_climate: !input trv_climate
  pid_climate: !input pid_climate
  pid_output_helper: !input pid_output_helper
  valve_helper: !input valve_helper
  parked_valve_helper: !input parked_valve_helper
  smart_mode: !input smart_mode
  boost_mode: !input boost_mode
  boost_start: !input boost_start
  boost_duration: !input boost_duration
triggers:
- trigger: state
  entity_id: !input trv_climate
  attribute: temperature
  id: trv_setpoint
- trigger: state
  entity_id: !input pid_climate
  attribute: temperature
  id: pid_setpoint
- trigger: state
  entity_id: !input pid_output_helper
  id: pid_output_changed
# PID climate entity switched off (back door, far-away mode) / back on
- trigger: state
  entity_id: !input pid_climate
  to: 'off'
  id: pid_off
- trigger: state
  entity_id: !input pid_climate
  from: 'off'
  not_to:
  - unavailable
  - unknown
  id: pid_on
- trigger: state
  entity_id: !input smart_mode
  id: smart_mode_changed
- trigger: state
  entity_id: !input parked_valve_helper
  id: parked_valve_changed
- trigger: state
  entity_id: !input boost_mode
  to: 'on'
  id: boost_on
- trigger: state
  entity_id: !input boost_mode
  to: 'off'
  id: boost_off
- trigger: time_pattern
  minutes: /5
  id: boost_timeout
- trigger: homeassistant
  event: start
  id: ha_start
actions:
- choose:
  # Physical TRV setpoint changed -> copy to PID
  - conditions:
    - condition: trigger
      id: trv_setpoint
    - condition: template
      value_template: >-
        {% set trv_temp = state_attr(trv_climate, 'temperature') %}
        {% set pid_temp = state_attr(pid_climate, 'temperature') %}
        {{ trv_temp != none and pid_temp != none and trv_temp != pid_temp }}
    sequence:
    - action: climate.set_temperature
      target:
        entity_id: !input pid_climate
      data:
        temperature: "{{ state_attr(trv_climate, 'temperature') }}"

  # PID setpoint changed -> copy to physical TRV
  - conditions:
    - condition: trigger
      id: pid_setpoint
    - condition: template
      value_template: >-
        {% set trv_temp = state_attr(trv_climate, 'temperature') %}
        {% set pid_temp = state_attr(pid_climate, 'temperature') %}
        {{ trv_temp != none and pid_temp != none and trv_temp != pid_temp }}
    sequence:
    - action: climate.set_temperature
      target:
        entity_id: !input trv_climate
      data:
        temperature: "{{ state_attr(pid_climate, 'temperature') }}"

  # Boost running longer than the configured duration -> switch it off (the
  # boost_off trigger then re-applies everything)
  - conditions:
    - condition: trigger
      id: boost_timeout
    - condition: state
      entity_id: !input boost_mode
      state: 'on'
    - condition: template
      value_template: >-
        {% set start = states(boost_start) %}
        {% if start not in ['unknown', 'unavailable', ''] %}
          {{ (now().timestamp() - as_timestamp(start)) >= (boost_duration | float(60)) * 60 }}
        {% else %}
          false
        {% endif %}
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: !input boost_mode

  # Everything else decides the PID mode and the valve position
  default:
  # (a setpoint echo or an unfinished boost-timeout poll that failed its
  # branch conditions above must not land here)
  - condition: not
    conditions:
    - condition: trigger
      id:
      - trv_setpoint
      - pid_setpoint
      - boost_timeout

  # Boost switched on -> stamp the start time
  - if:
    - condition: trigger
      id: boost_on
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: !input boost_start
      data:
        timestamp: "{{ now().timestamp() }}"

  # Explicit re-apply (smart mode / parked position changed, boost ended, HA
  # start, manual trigger), not during boost: valve sync on, PID climate on
  - if:
    - condition: not
      conditions:
      - condition: trigger
        id:
        - boost_on
        - pid_output_changed
        - pid_off
        - pid_on
    - condition: state
      entity_id: !input boost_mode
      state: 'off'
    then:
    - action: automation.turn_on
      target:
        entity_id: !input valve_sync_automation

  # PID mode: auto only while smart mode is on and boost is off. Not for PID
  # output ticks, and not while the climate entity is off.
  - if:
    - condition: not
      conditions:
      - condition: trigger
        id:
        - pid_output_changed
        - pid_off
    - condition: not
      conditions:
      - condition: state
        entity_id: !input pid_climate
        state: 'off'
    then:
    - action: smart_thermostat.set_pid_mode
      target:
        entity_id: !input pid_climate
      data:
        mode: >-
          {{ 'auto' if is_state(smart_mode, 'on') and is_state(boost_mode, 'off')
             else 'off' }}

  # Valve arbitration: off -> 0, boost -> 100, smart -> PID output, else parked
  - variables:
      target_valve: >-
        {% if is_state(pid_climate, 'off') %}
          0
        {% elif is_state(boost_mode, 'on') %}
          100
        {% elif is_state(smart_mode, 'on') %}
          {{ states(pid_output_helper) | float(0) }}
        {% else %}
          {{ states(parked_valve_helper) | float(50) }}
        {% endif %}
  - if:
    - condition: template
      value_template: >-
        {{ (states(valve_helper) | float(-1)) != (target_valve | float(0)) }}
    then:
    - action: input_number.set_value
      target:
        entity_id: !input valve_helper
      data:
        value: "{{ target_valve | float(0) }}"
