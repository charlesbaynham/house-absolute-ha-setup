---
# Charles's Morning Alarm Package
#
# Based on Gaby's alarm (packages/alarm_gaby.yaml), for the master bedroom, but
# with a single alarm time and no flashing: when the alarm triggers, the master
# bedroom lamp turns on (cosy scene) and stays on, and the blinds open. The main
# ceiling lights and the hallway are not touched.
#
# The helper keeps the entity ID input_datetime.charles_alarm_time_1 from when
# this package had two alarm times, so an already-set time survives the change.
#
# The weekend schedule and holiday mode behave exactly as Gaby's do:
# disabled Fridays at 10:00, re-enabled Sundays at 12:00 unless holiday mode
# is on; turning holiday mode on switches the alarm off; switching the alarm
# back on by hand clears holiday mode.
#
# The lamp coming on after 5am also triggers the rain warning
# (packages/rain_warning.yaml), which briefly shows the forecast colour before
# restoring the cosy scene.

input_datetime:
  charles_alarm_time_1:
    name: Charles's Alarm Time
    has_date: false
    has_time: true
    icon: mdi:alarm

input_boolean:
  charles_alarm_enabled:
    name: Charles's Alarm Enabled
    icon: mdi:alarm-check
  charles_alarm_holiday_mode:
    name: "Charles's Alarm - DISABLE INDEFINITELY (holiday mode - won't turn back on automatically!)"
    icon: mdi:airplane

automation:
  - id: '1791360000000'
    alias: Charles's morning alarm
    description: >
      Turn on the master bedroom lamp and open the blinds when Charles's
      alarm time is reached
    triggers:
      - trigger: time
        at: input_datetime.charles_alarm_time_1
    conditions:
      - condition: state
        entity_id: input_boolean.charles_alarm_enabled
        state: 'on'
    actions:
      - action: cover.open_cover
        target:
          entity_id: cover.master_bedroom_blinds
      # Lamp on and left on (also records the state tracker)
      - action: script.master_bedroom_cosy
    mode: single

  - id: '1791360000001'
    alias: Charles's alarm - disable on Friday
    description: >
      Automatically disable alarm every Friday at 10:00
    triggers:
      - trigger: time
        at: '10:00:00'
    conditions:
      - condition: time
        weekday:
          - fri
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.charles_alarm_enabled
    mode: single

  - id: '1791360000002'
    alias: Charles's alarm - enable on Sunday
    description: >
      Automatically enable alarm every Sunday at 12:00 (noon), unless
      holiday mode is on
    triggers:
      - trigger: time
        at: '12:00:00'
    conditions:
      - condition: time
        weekday:
          - sun
      - condition: state
        entity_id: input_boolean.charles_alarm_holiday_mode
        state: 'off'
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.charles_alarm_enabled
    mode: single

  - id: '1791360000003'
    alias: Charles's alarm - holiday mode activated
    description: >
      Immediately turn the alarm off when holiday mode is switched on.
    triggers:
      - trigger: state
        entity_id: input_boolean.charles_alarm_holiday_mode
        to: 'on'
    conditions: []
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.charles_alarm_enabled
    mode: single

  - id: '1791360000004'
    alias: Charles's alarm - clear holiday mode when alarm re-enabled
    description: >
      Turn holiday mode off as soon as the alarm is switched back on by hand,
      so the Sunday auto-enable isn't silently blocked (see the same
      automation in packages/alarm_gaby.yaml).
    triggers:
      - trigger: state
        entity_id: input_boolean.charles_alarm_enabled
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_boolean.charles_alarm_holiday_mode
        state: 'on'
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.charles_alarm_holiday_mode
    mode: single
