---
# Charles's Morning Alarm Package
#
# A copy of Gaby's alarm (packages/alarm_gaby.yaml) for the master bedroom.
# When either alarm time triggers, the master bedroom lamp flashes 3 times,
# then is left on (cosy scene) and the blinds open. The main ceiling lights
# and the hallway are not touched.
#
# The weekend schedule and holiday mode behave exactly as Gaby's do:
# disabled Fridays at 10:00, re-enabled Sundays at 12:00 unless holiday mode
# is on; turning holiday mode on switches the alarm off; switching the alarm
# back on by hand clears holiday mode.
#
# RAIN WARNING INTERACTION
#   packages/rain_warning.yaml flashes the forecast colour on the lamp's first
#   turn-on after 5am, snapshotting the lamp first and restoring it 10s later.
#   Left alone it would fire on the first flash of the alarm, snapshot the
#   lamp mid-flash (possibly "off"), and restore it to off once the alarm had
#   finished. So the alarm holds rain_warning_shown_today on while it flashes,
#   then releases it just before the final turn-on - the forecast colour then
#   shows cleanly as the alarm's last word, and the lamp is restored to the
#   cosy scene afterwards.

input_datetime:
  charles_alarm_time_1:
    name: Charles's Alarm Time 1
    has_date: false
    has_time: true
    icon: mdi:alarm
  charles_alarm_time_2:
    name: Charles's Alarm Time 2
    has_date: false
    has_time: true
    icon: mdi:alarm

input_boolean:
  charles_alarm_enabled:
    name: Charles's Alarm Enabled
    icon: mdi:alarm-check
  charles_alarm_holiday_mode:
    name: "Charles's Alarm - DISABLE INDEFINITELY (holiday mode - won't turn back on automatically!)"
    icon: mdi:airplane

automation:
  - id: '1791360000000'
    alias: Charles's morning alarm
    description: >
      Flash the master bedroom lamp 3 times, leave it on and open the blinds
      when either of Charles's alarm times triggers
    triggers:
      - trigger: time
        at: input_datetime.charles_alarm_time_1
      - trigger: time
        at: input_datetime.charles_alarm_time_2
    conditions:
      - condition: state
        entity_id: input_boolean.charles_alarm_enabled
        state: 'on'
    actions:
      - variables:
          rain_warning_pending: "{{ is_state('input_boolean.rain_warning_shown_today', 'off') }}"
      # Keep the rain warning from firing mid-flash (see header)
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.rain_warning_shown_today
      - action: cover.open_cover
        target:
          entity_id: cover.master_bedroom_blinds
      # Flash lamp 3 times
      - repeat:
          count: 3
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.master_bedroom_lamp
            - delay:
                milliseconds: 1000
            - action: light.turn_off
              target:
                entity_id: light.master_bedroom_lamp
            - delay:
                milliseconds: 1000
      # Hand the rain warning back, so it fires on the final turn-on below
      - if:
          - condition: template
            value_template: "{{ rain_warning_pending }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.rain_warning_shown_today
      # Leave the lamp on (also records the state tracker)
      - action: script.master_bedroom_cosy
    mode: single

  - id: '1791360000001'
    alias: Charles's alarm - disable on Friday
    description: >
      Automatically disable alarm every Friday at 10:00
    triggers:
      - trigger: time
        at: '10:00:00'
    conditions:
      - condition: time
        weekday:
          - fri
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.charles_alarm_enabled
    mode: single

  - id: '1791360000002'
    alias: Charles's alarm - enable on Sunday
    description: >
      Automatically enable alarm every Sunday at 12:00 (noon), unless
      holiday mode is on
    triggers:
      - trigger: time
        at: '12:00:00'
    conditions:
      - condition: time
        weekday:
          - sun
      - condition: state
        entity_id: input_boolean.charles_alarm_holiday_mode
        state: 'off'
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.charles_alarm_enabled
    mode: single

  - id: '1791360000003'
    alias: Charles's alarm - holiday mode activated
    description: >
      Immediately turn the alarm off when holiday mode is switched on.
    triggers:
      - trigger: state
        entity_id: input_boolean.charles_alarm_holiday_mode
        to: 'on'
    conditions: []
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.charles_alarm_enabled
    mode: single

  - id: '1791360000004'
    alias: Charles's alarm - clear holiday mode when alarm re-enabled
    description: >
      Turn holiday mode off as soon as the alarm is switched back on by hand,
      so the Sunday auto-enable isn't silently blocked (see the same
      automation in packages/alarm_gaby.yaml).
    triggers:
      - trigger: state
        entity_id: input_boolean.charles_alarm_enabled
        to: 'on'
    conditions:
      - condition: state
        entity_id: input_boolean.charles_alarm_holiday_mode
        state: 'on'
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.charles_alarm_holiday_mode
    mode: single
