---
# Gaby's Morning Alarm Package
#
# Allows Gaby to set two alarm times and enable/disable the alarm.
# When either alarm triggers, the bedroom lamp and hallway lights flash 3 times
# and stay on.
# The alarm is automatically disabled on Fridays at 10:00 AM and
# re-enabled on Sundays at 12:00 PM.
#
# A separate "holiday mode" boolean lets you disable the alarm indefinitely
# (e.g. school holidays) — turning it on switches the alarm off immediately
# and blocks the Sunday auto re-enable until holiday mode is turned off again.
# It does NOT turn itself back off, so it must be manually disabled at the
# end of the holiday.
#
# Components:
# - Two input_datetime helpers for alarm time selection
# - input_boolean to enable/disable alarm
# - input_boolean to disable the alarm indefinitely (holiday mode)
# - Two automations (one for each alarm time)
# - Two automations for weekend schedule (disable Friday, enable Sunday,
#   the latter gated on holiday mode being off)
# - One automation to turn the alarm off as soon as holiday mode is enabled

input_datetime:
  gaby_alarm_time_1:
    name: Gaby's Alarm Time 1
    has_date: false
    has_time: true
    icon: mdi:alarm
  gaby_alarm_time_2:
    name: Gaby's Alarm Time 2
    has_date: false
    has_time: true
    icon: mdi:alarm

input_boolean:
  gaby_alarm_enabled:
    name: Gaby's Alarm Enabled
    icon: mdi:alarm-check
  gaby_alarm_holiday_mode:
    name: "Gaby's Alarm - DISABLE INDEFINITELY (holiday mode - won't turn back on automatically!)"
    icon: mdi:airplane

automation:
  - id: '1732500000000'
    alias: Gaby's morning alarm 1
    description: >
      Flash bedroom lamp and hallway lights 3 times and leave on
      when alarm 1 triggers
    triggers:
      - trigger: time
        at: input_datetime.gaby_alarm_time_1
    conditions:
      - condition: state
        entity_id: input_boolean.gaby_alarm_enabled
        state: 'on'
    actions:
      # Flash lights 3 times
      - repeat:
          count: 3
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.bedroom_lamp
            - action: light.turn_on
              target:
                area_id: hallway
            - delay:
                milliseconds: 1000
            - action: light.turn_off
              target:
                entity_id:
                  - light.bedroom_lamp
            - action: light.turn_off
              target:
                area_id: hallway
            - delay:
                milliseconds: 1000
      # Leave lights on
      - action: light.turn_on
        target:
          entity_id:
            - light.bedroom_lamp
      - action: light.turn_on
        target:
          area_id: hallway
    mode: single

  - id: '1732500000001'
    alias: Gaby's morning alarm 2
    description: >
      Flash bedroom lamp and hallway lights 3 times and leave on
      when alarm 2 triggers
    triggers:
      - trigger: time
        at: input_datetime.gaby_alarm_time_2
    conditions:
      - condition: state
        entity_id: input_boolean.gaby_alarm_enabled
        state: 'on'
    actions:
      # Flash lights 3 times
      - repeat:
          count: 3
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.bedroom_lamp
            - action: light.turn_on
              target:
                area_id: hallway
            - delay:
                milliseconds: 1000
            - action: light.turn_off
              target:
                entity_id:
                  - light.bedroom_lamp
            - action: light.turn_off
              target:
                area_id: hallway
            - delay:
                milliseconds: 1000
      # Leave lights on
      - action: light.turn_on
        target:
          entity_id:
            - light.bedroom_lamp
      - action: light.turn_on
        target:
          area_id: hallway
    mode: single

  - id: '1779354200000'
    alias: Gaby bedroom lights off when away
    description: >
      Turn off bedroom lights when Gaby has been away from home for 5 minutes
    triggers:
      - trigger: state
        entity_id: person.gaby
        from: home
        to: not_home
        for:
          minutes: 5
    conditions: []
    actions:
      - action: light.turn_off
        target:
          area_id: bedroom
    mode: single

  - id: '1739471156000'
    alias: Gaby's alarm - disable on Friday
    description: >
      Automatically disable alarm every Friday at 10:00
    triggers:
      - trigger: time
        at: '10:00:00'
    conditions:
      - condition: time
        weekday:
          - fri
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gaby_alarm_enabled
    mode: single

  - id: '1739471156001'
    alias: Gaby's alarm - enable on Sunday
    description: >
      Automatically enable alarm every Sunday at 12:00 (noon), unless
      holiday mode is on
    triggers:
      - trigger: time
        at: '12:00:00'
    conditions:
      - condition: time
        weekday:
          - sun
      - condition: state
        entity_id: input_boolean.gaby_alarm_holiday_mode
        state: 'off'
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.gaby_alarm_enabled
    mode: single

  - id: '1785400000000'
    alias: Gaby's alarm - holiday mode activated
    description: >
      Immediately turn the alarm off when holiday mode is switched on.
      Holiday mode does not turn itself back off, and blocks the Sunday
      auto-enable automation, so the alarm stays off indefinitely until
      holiday mode is manually disabled again.
    triggers:
      - trigger: state
        entity_id: input_boolean.gaby_alarm_holiday_mode
        to: 'on'
    conditions: []
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gaby_alarm_enabled
    mode: single
