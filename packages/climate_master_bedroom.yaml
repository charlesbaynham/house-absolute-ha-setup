---
# Master Bedroom Climate Control Package
#
# PID-controlled TRV system for master bedroom heating.
# Uses external temperature sensor and smart_thermostat integration.
#
# Components:
# - PID controller climate entity
# - Helper for valve position (0-100)
# - Valve position sync automation (blueprint)
# - External sensor sync automation (blueprint)
# - Room control automation (blueprint): bidirectional setpoint sync
#   (physical TRV ↔ PID controller), smart mode, boost and boost timeout
# - One-time 4am heating restart automation (self-disabling)
#
# Physical device: climate.trv_master_bedroom
# External sensor: sensor.sensor_master_bedroom_temperature
#
# Blueprints used:
# - charlesbaynham/trv-room-control.yaml
# - charlesbaynham/trv-hot-while-closed-watchdog.yaml
# - arnie580/sonoff-trv-pid.yaml
# - photomoose/sonoff-trvzb-external-temperature-sensor-calibration.yaml

input_number:
  master_bedroom_trv_valve_position:
    name: Master bedroom TRV Valve Position
    initial: 0
    min: 0
    max: 100
    step: 1

  master_bedroom_trv_parked_valve_position:
    name: Master bedroom TRV parked valve position
    icon: mdi:valve
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"

input_boolean:
  smart_mode_master_bedroom:
    name: Smart mode - Master bedroom
    icon: mdi:thermostat-auto
  boost_mode_master_bedroom:
    name: Boost Mode - Master Bedroom
    icon: mdi:rocket-launch
    initial: false

input_datetime:
  boost_start_master_bedroom:
    name: Boost Start - Master Bedroom
    has_date: true
    has_time: true
    icon: mdi:clock-start

button:
  - platform: template
    buttons:
      boost_master_bedroom:
        unique_id: boost_button_master_bedroom
        friendly_name: "Boost Master Bedroom"
        icon_template: mdi:rocket-launch
        press:
          - action: input_boolean.toggle
            target:
              entity_id: input_boolean.boost_mode_master_bedroom

climate:
  - platform: smart_thermostat
    name: Master bedroom TRV PID controller
    unique_id: trv_pid_master_bedroom
    heater: input_number.master_bedroom_trv_valve_position
    target_sensor: sensor.sensor_master_bedroom_temperature
    min_temp: 7
    max_temp: 28
    ac_mode: False
    target_temp: 19
    keep_alive:
      seconds: 60
    kp: 30
    ki: 0.005
    kd: 2000
    pwm: 0

automation:
  - id: '1761691019775'
    alias: Master bedroom TRV - sync valve with helper
    description: 'Copy the settings from the 0 - 100 helper to the TRV valve position.
      This will be controlled by a PID controller from Smart thermostat (PID) - see
      the YAML. '
    use_blueprint:
      path: arnie580/sonoff-trv-pid.yaml
      input:
        thermostat_value: input_number.master_bedroom_trv_valve_position
        max_valve_opening: number.trv_master_bedroom_valve_opening_degree
        max_valve_closing: number.trv_master_bedroom_valve_closing_degree

  - id: '1790000000002'
    alias: Master bedroom TRV - hot while closed watchdog
    description: 'Notify if the radiator stays hot although the valve is commanded closed (TRV has probably lost calibration and needs a manual re-adaptation).'
    use_blueprint:
      path: charlesbaynham/trv-hot-while-closed-watchdog.yaml
      input:
        room_name: Master bedroom
        valve_helper: input_number.master_bedroom_trv_valve_position
        closing_degree: number.trv_master_bedroom_valve_closing_degree
        trv_temperature: sensor.trv_master_bedroom_local_temperature
        room_temperature: sensor.sensor_master_bedroom_temperature
        threshold: 4
        notify_actions:
        - action: notify.mobile_app_pixel_6
          data:
            title: "Master bedroom TRV needs recalibrating"
            message: "{{ message }}"

  - id: '1761479998275'
    alias: Sync master bedroom TRV with external sensor
    description: ''
    use_blueprint:
      path: photomoose/sonoff-trvzb-external-temperature-sensor-calibration.yaml
      input:
        external_temperature_sensor: sensor.sensor_master_bedroom_temperature
        trv_external_temperature_input:
        - number.trv_master_bedroom_external_temperature_input

  - id: '1790000000013'
    alias: Master bedroom TRV - control
    description: 'Setpoint sync (physical TRV <-> PID), smart mode and boost for this room. See the blueprint. Triggering it manually re-applies smart mode.'
    use_blueprint:
      path: charlesbaynham/trv-room-control.yaml
      input:
        trv_climate: climate.trv_master_bedroom
        pid_climate: climate.master_bedroom_trv_pid_controller
        valve_helper: input_number.master_bedroom_trv_valve_position
        parked_valve_helper: input_number.master_bedroom_trv_parked_valve_position
        smart_mode: input_boolean.smart_mode_master_bedroom
        boost_mode: input_boolean.boost_mode_master_bedroom
        boost_start: input_datetime.boost_start_master_bedroom
        valve_sync_automation: automation.master_bedroom_trv_sync_valve_with_helper

  - id: '1763508383336'
    alias: Master bedroom restart heating at 4am
    description: ''
    triggers:
    - trigger: time
      at: 04:00:00
    conditions: []
    actions:
    - action: climate.set_temperature
      metadata: {}
      data:
        temperature: 22
        hvac_mode: heat
      target:
        entity_id: climate.master_bedroom_trv_pid_controller
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: false
      target:
        entity_id: automation.master_bedroom_restart_heating_at_4am
    mode: single
