---
# Back Door Package
#
# Alert: push notification when the back door opens and Charles is not home
# (mirrors the "Door opened alert" for the front door in automations.yaml).
#
# Sensor: binary_sensor.backdoor_sensor_contact (Z2M "Backdoor sensor")
#
# The heating pause while the door is open is no longer here: it is rule 1 of the
# per-room heating policy (blueprints/automation/charlesbaynham/trv-room-policy.yaml),
# which has no "rooms to resume" list to lose or get out of step.

automation:
  - id: '1762500000001'
    alias: Back door opened alert
    description: Notify Charles's phone when the back door opens and he is not home
    triggers:
      - trigger: state
        entity_id: binary_sensor.backdoor_sensor_contact
        from: 'off'
        to: 'on'
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: person.charles
            state: home
    actions:
      - action: notify.mobile_app_pixel_6
        data:
          message: The back door has opened
    mode: single
