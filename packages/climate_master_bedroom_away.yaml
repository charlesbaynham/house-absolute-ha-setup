---
# Master Bedroom - heating off while Charles is away
#
# When Charles is confirmed away (binary_sensor.charles_confirmed_away: >10 km
# from home, fresh location report; see packages/alarm_charles.yaml) for 10
# minutes, switch off the master bedroom PID heating. When he gets home, switch
# it back on - but only if this automation was what turned it off.
#
# Local override, for when someone else is staying in the room:
# - input_boolean.master_bedroom_heating_away_override ("occupied"): while on,
#   the heating is left alone. Turning it on also restores heating that this
#   automation had switched off.
# - Boost Mode - Master Bedroom switched on while away counts as the override
#   (and restores the heating, so the boost actually does something).
# - Turning the PID climate entity to `heat` by hand (dashboard / app / voice -
#   a service call with a user context) counts as the override. Other
#   automations switching it on (e.g. climate_away_mode turning every room
#   on when Gaby gets home) do not: it is switched straight off again.
# The override clears itself when Charles gets home, so the next trip starts
# normal.
#
# Notes:
# - input_boolean.master_bedroom_heating_off_for_away records "this
#   automation turned it off", so a room that was already off for another
#   reason (back door, far-away mode, set by hand) is not switched on at the
#   end. It is
#   restored across HA restarts.
# - Return is `person.charles` -> home, not the sensor going off: the sensor
#   also goes off when location reports go stale or he is <10 km away, and the
#   heating should stay off until he is actually back.
# - Restoring heat follows packages/back_door.yaml: set `heat`, then trigger the
#   room control automation (skip_condition) so PID / parked valve is
#   re-applied.
#
# Entities: climate.master_bedroom_trv_pid_controller,
#   automation.master_bedroom_trv_control (packages/climate_master_bedroom.yaml)

input_boolean:
  master_bedroom_heating_away_override:
    name: Master bedroom occupied - keep heating while Charles is away
    icon: mdi:bed
  master_bedroom_heating_off_for_away:
    name: Master bedroom heating switched off because Charles is away
    icon: mdi:radiator-off

automation:
  - id: '1791500000001'
    alias: Master bedroom heating - off while Charles is away
    description: >-
      Switch the master bedroom heating off when Charles is confirmed away and
      back on when he gets home. Overridable by the "occupied" switch, boost
      mode, or turning the heating on by hand. See the package header.
    triggers:
      - trigger: state
        entity_id: binary_sensor.charles_confirmed_away
        to: 'on'
        for:
          minutes: 10
        id: away
      - trigger: state
        entity_id: person.charles
        to: home
        id: home
      - trigger: state
        entity_id: input_boolean.master_bedroom_heating_away_override
        to: 'on'
        id: override_on
      - trigger: state
        entity_id: input_boolean.master_bedroom_heating_away_override
        to: 'off'
        id: override_off
      - trigger: state
        entity_id: input_boolean.boost_mode_master_bedroom
        to: 'on'
        id: boost_on
      # Heating switched on by someone or something
      - trigger: state
        entity_id: climate.master_bedroom_trv_pid_controller
        from: 'off'
        to: heat
        id: heat_on
      - trigger: homeassistant
        event: start
        id: ha_start
    conditions: []
    actions:
      - variables:
          away: "{{ is_state('binary_sensor.charles_confirmed_away', 'on') }}"
          switched_off: >-
            {{ is_state('input_boolean.master_bedroom_heating_off_for_away',
               'on') }}
      - choose:
          # Heating wanted again: Charles home, override on, or boost pressed
          - conditions:
              - condition: trigger
                id:
                  - home
                  - override_on
                  - boost_on
            sequence:
              # Home ends the override for next time
              - if:
                  - condition: trigger
                    id: home
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id:
                        input_boolean.master_bedroom_heating_away_override
              # Boost while the heating is away-off is an override
              - if:
                  - condition: trigger
                    id: boost_on
                  - condition: template
                    value_template: "{{ away or switched_off }}"
                then:
                  - action: input_boolean.turn_on
                    target:
                      entity_id:
                        input_boolean.master_bedroom_heating_away_override
              # Only undo our own switch-off
              - if:
                  - condition: template
                    value_template: "{{ switched_off }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id:
                        input_boolean.master_bedroom_heating_off_for_away
                  - action: climate.set_hvac_mode
                    target:
                      entity_id: climate.master_bedroom_trv_pid_controller
                    data:
                      hvac_mode: heat
                  # Re-apply PID / parked valve (and boost) via the room control
                  - action: automation.trigger
                    target:
                      entity_id: automation.master_bedroom_trv_control
                    data:
                      skip_condition: true

          # Someone turned the heating on by hand while Charles is away
          - conditions:
              - condition: trigger
                id: heat_on
              - condition: template
                value_template: >-
                  {{ trigger.to_state.context.user_id is not none }}
              - condition: template
                value_template: "{{ away }}"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    input_boolean.master_bedroom_heating_away_override
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    input_boolean.master_bedroom_heating_off_for_away

          # Charles away, no override, heating on: switch it off
          - conditions:
              - condition: trigger
                id:
                  - away
                  - override_off
                  - heat_on
                  - ha_start
              - condition: template
                value_template: "{{ away }}"
              # Never act while he is actually home (sensor lag on return)
              - condition: not
                conditions:
                  - condition: state
                    entity_id: person.charles
                    state: home
              - condition: state
                entity_id:
                  input_boolean.master_bedroom_heating_away_override
                state: 'off'
              - condition: state
                entity_id: climate.master_bedroom_trv_pid_controller
                state: heat
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id:
                    input_boolean.master_bedroom_heating_off_for_away
              - action: climate.turn_off
                target:
                  entity_id: climate.master_bedroom_trv_pid_controller
    mode: queued
    max: 10
