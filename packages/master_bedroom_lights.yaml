---
# Master Bedroom Lights Package
#
# Controls the master bedroom through three "ingredients":
#   - Lamp  (light.master_bedroom_lamp)               dimmable + colour
#   - Main ceiling lights (light.master_bedroom_main_lights_right)  on/off only
#   - Curtains (cover.master_bedroom_blinds, via script.toggle_blinds)
#
# MODES
#   Three lighting modes, each a USER-EDITABLE scene in scenes.yaml (tweak them in
#   the HA Scene editor), plus off:
#     scene.master_bedroom_full     - main lights on + lamp full
#     scene.master_bedroom_cosy     - lamp only, warm & relaxed (~60%)
#     scene.master_bedroom_minimum  - lamp only, warmest colour, lowest brightness
#   Every button decides what to do from the lights' actual state - there is no
#   separate state tracker to drift out of sync.
#
# CONTROLS
#   Bedside switch - 4 buttons (Hue dimmer "Master bedroom wireless switch"),
#   listed top to bottom:
#     on   (top)      -> Full
#     up   (2nd)      -> Toggle curtains/blinds
#     down (3rd)      -> Cosy
#     off  (bottom)   -> Everything off; if everything is already off -> Minimum
#     off  (hold)     -> Toggle the bedroom fan (fan.master_bedroom_fan)
#   Door switch - 2 buttons (Aqara)
#     right -> Full <-> off
#     left  -> Toggle curtains
#
# DOOR SWITCH RELAY COUPLING
#   The Aqara's right button is in `control_relay` mode (set in Zigbee2MQTT), so a
#   press physically toggles the ceiling relay *before* HA sees the button event -
#   the main lights keep working even if HA is down. The automation therefore must
#   not toggle anything itself: it reads the relay's new state and brings the lamp
#   in line (relay on -> full, relay off -> everything off). An earlier version ran
#   an independent mode cycle here, which got out of step with the relay and
#   turned the lamp ON to ~1% when the lights were switched off at the door.
#
# SCENE COLOUR TEMPERATURE
#   The lamp scenes in scenes.yaml must express colour temperature as
#   `color_temp_kelvin`. The mireds-based `color_temp` was removed in HA 2026.3;
#   a scene still using it applies its brightness but silently ignores the
#   colour, leaving the lamp on whatever colour it happened to be showing.
#
# RELATED
#   The rain-warning package (packages/rain_warning.yaml) flashes the lamp
#   green/blue on the first morning turn-on. Charles's alarm
#   (packages/alarm_charles.yaml) uses script.master_bedroom_cosy.

script:

  master_bedroom_full:
    alias: Master bedroom - full
    icon: mdi:lightbulb-on
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.master_bedroom_full
        data:
          transition: 1

  master_bedroom_cosy:
    alias: Master bedroom - cosy
    icon: mdi:sofa
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.master_bedroom_cosy
        data:
          transition: 2

  master_bedroom_minimum:
    alias: Master bedroom - minimum
    icon: mdi:lightbulb-night
    sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.master_bedroom_minimum
        data:
          transition: 1

  master_bedroom_off:
    alias: Master bedroom - all off
    icon: mdi:lightbulb-off
    sequence:
      - action: light.turn_off
        target:
          entity_id:
            - light.master_bedroom_lamp
            - light.master_bedroom_main_lights_right
        data:
          transition: 1

  # Bedside bottom button: off if anything is on, otherwise a night-light.
  master_bedroom_off_or_minimum:
    alias: Master bedroom - off, or minimum if already off
    icon: mdi:lightbulb-night-outline
    sequence:
      - if:
          - condition: state
            entity_id: light.master_bedroom_lamp
            state: "off"
          - condition: state
            entity_id: light.master_bedroom_main_lights_right
            state: "off"
        then:
          - action: script.master_bedroom_minimum
        else:
          - action: script.master_bedroom_off

automation:

  # ---------------------------------------------------------------------------
  # BEDSIDE SWITCH (4 buttons) - Hue dimmer via the patpac9 blueprint.
  # ---------------------------------------------------------------------------
  - id: "1748385723267"
    alias: Master bedroom bedside switch
    description: >
      4-button bedside Hue dimmer - full / blinds / cosy / off-or-minimum,
      hold bottom toggles fan
    use_blueprint:
      path: patpac9/Hue_Dimmer_Switch_Easy_Custom_Buttons.yaml
      input:
        controller: Master bedroom wireless switch
        on_released:
          - action: script.master_bedroom_full
        up_released:
          - action: script.toggle_blinds
        down_released:
          - action: script.master_bedroom_cosy
        off_released:
          - action: script.master_bedroom_off_or_minimum
        on_hold_released: []
        off_hold_released:
          - action: fan.toggle
            target:
              entity_id: fan.master_bedroom_fan

  # ---------------------------------------------------------------------------
  # DOOR SWITCH (2 buttons) - Aqara, raw MQTT device actions.
  # Right button is relay-coupled: see "DOOR SWITCH RELAY COUPLING" above.
  # ---------------------------------------------------------------------------
  - id: "1771800062963"
    alias: Master bedroom door switch - lights
    description: Right button - follow the ceiling relay (on -> full, off -> all off)
    triggers:
      - domain: mqtt
        device_id: 07ee2aa42b249d96057fbec264b7a25f
        type: action
        subtype: single_right
        trigger: device
    conditions: []
    actions:
      - if:
          - condition: state
            entity_id: light.master_bedroom_main_lights_right
            state: "on"
        then:
          - action: script.master_bedroom_full
        else:
          - action: script.master_bedroom_off
    # Queued so rapid presses each follow the relay state at the time they land.
    mode: queued
    max: 5

  - id: "1771800897993"
    alias: Master bedroom door switch - curtains
    description: Left button toggles the curtains
    triggers:
      - domain: mqtt
        device_id: 07ee2aa42b249d96057fbec264b7a25f
        type: action
        subtype: single_left
        trigger: device
    conditions: []
    actions:
      - action: script.toggle_blinds
    mode: single
