- id: '1760784792347'
  alias: Restart let's encrypt daily
  description: ''
  triggers:
  - trigger: time
    at: 02:00:00
  conditions: []
  actions:
  - action: hassio.addon_restart
    metadata: {}
    data:
      addon: core_letsencrypt
  mode: single
- id: '1729425600000'
  alias: Turn off all lights when everyone leaves
  description: Automatically turn off all lights when no one is home
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.anyone_home
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      area_id:
      - master_bedroom
      - hallway
      - living_room
      - bedroom
      - garden
      - bathroom
      - kitchen
  mode: single
- id: '1729776000000'
  alias: Auto-commit configuration changes
  description: Automatically commit and push HA configuration changes every 30 minutes
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions: []
  actions:
  - action: shell_command.git_commit_push
    metadata: {}
    data: {}
    response_variable: response
  mode: single
- id: '1762099115353'
  alias: Bedroom lights copy main
  description: ''
  use_blueprint:
    path: homeassistant/lamp_controls_area.yaml
    input:
      lamp_entity: light.bedroom_lamp
      area: bedroom
- id: '1730595645000'
  alias: Vacuum when everyone leaves
  description: Start the vacuum 30 minutes after the last person leaves, max once
    per day
  triggers:
  - trigger: state
    entity_id: binary_sensor.anyone_home
    from: 'on'
    to: 'off'
  conditions:
  - condition: template
    value_template: '{% set last_run = state_attr(''automation.vacuum_when_everyone_leaves'',
      ''last_triggered'') %} {{ last_run == none or (now() - last_run).total_seconds()
      > 72000 }}

      '
  - condition: state
    entity_id: input_boolean.night_mode
    state: 'off'
  actions:
  - delay:
      hours: 0
      minutes: 30
      seconds: 0
  - condition: state
    state:
    - 'off'
    entity_id: binary_sensor.anyone_home
  - action: vacuum.start
    metadata: {}
    data: {}
    target:
      device_id:
      - 8494972a3e4dd42011930160e8845cec
  mode: single
- id: '1766950369548'
  alias: 'Oneoff: welcome home'
  description: ''
  triggers:
  - type: opened
    device_id: 8a4c980ba6e0608c7b56fc7b9a25db16
    entity_id: 5c680383496e884c0dffac3922c3d5d2
    domain: binary_sensor
    trigger: device
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - action: tts.speak
    metadata: {}
    target:
      entity_id: tts.google_translate_en_com
    data:
      cache: true
      media_player_entity_id: media_player.all_speakers
      message: Welcome back to House Absolute, Gaby. The house has been pre-heated
        for your pleasure. You will be missed in Wales.
  - action: automation.turn_off
    metadata: {}
    target:
      entity_id: automation.oneoff_welcome_home
    data:
      stop_actions: false
  mode: single
- id: '1769862562266'
  alias: Door opened alert
  description: ''
  triggers:
  - type: opened
    device_id: 8a4c980ba6e0608c7b56fc7b9a25db16
    entity_id: 5c680383496e884c0dffac3922c3d5d2
    domain: binary_sensor
    trigger: device
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: person.charles
      state:
      - home
  actions:
